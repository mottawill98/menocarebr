<title>ROI dos Criativos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
  /* Layout: ações primeiro, depois totais, controles e a tabela completa com a coluna do anúncio fixa. */
  :root {
    --bg: #f5f7f4;
    --surface: #ffffff;
    --ink: #14201c;
    --ink-2: #4a5853;
    --muted: #75827c;
    --line: #dde3df;
    --chip: #eaf0ec;
    --accent: #0b6b5c;
    --accent-soft: #dcefe9;
    --good: #0a7a4a;
    --bad: #c0392b;
    --warn: #9a5b00;
    --warn-bg: #fff3dc;
    --warn-line: #f0d6a0;
    --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-head: "Space Grotesk", "Inter", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1513; --surface: #172019; --ink: #e9efeb; --ink-2: #b2beb8; --muted: #86938d;
      --line: #26332d; --chip: #1f2a24; --accent: #3fb59f; --accent-soft: #14312b;
      --good: #4cc38a; --bad: #ef6b5b; --warn: #e0a23c; --warn-bg: #2a2214; --warn-line: #4a3b1c;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1513; --surface: #172019; --ink: #e9efeb; --ink-2: #b2beb8; --muted: #86938d;
    --line: #26332d; --chip: #1f2a24; --accent: #3fb59f; --accent-soft: #14312b;
    --good: #4cc38a; --bad: #ef6b5b; --warn: #e0a23c; --warn-bg: #2a2214; --warn-line: #4a3b1c;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.45;
    padding-block: 24px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap { max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; min-width: 0; }
  h1, h2, h3 { font-family: var(--font-head); font-weight: 600; margin: 0; text-wrap: balance; }
  h1 { font-size: 26px; letter-spacing: -0.01em; }
  h2 { font-size: 17px; }
  p { margin: 0; }
  .sub { color: var(--ink-2); margin-top: 4px; max-width: 70ch; }
  .tab { font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
  .panel-title { font-family: var(--font-head); font-weight: 600; font-size: 15px; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 6px; }

  /* O que fazer */
  .actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
  .action { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .action header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .action h3 { font-size: 15px; }
  .count { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--chip); color: var(--ink-2); }
  .rule { font-size: 12px; color: var(--muted); }
  .action.scale { border-top: 3px solid var(--good); }
  .action.pause { border-top: 3px solid var(--bad); }
  .action.inad { border-top: 3px solid var(--warn); }
  .action.check { border-top: 3px solid var(--muted); }
  .items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .items li { border-top: 1px solid var(--line); }
  .items button { display: flex; width: 100%; justify-content: space-between; align-items: baseline; gap: 12px; text-align: left; background: none; border: 0; padding: 7px 0; }
  .items button:hover .nm { text-decoration: underline; }
  .nm { font-weight: 600; overflow-wrap: anywhere; }
  .meta { font-size: 12px; color: var(--ink-2); text-align: right; white-space: nowrap; }
  .more { font-size: 12px; color: var(--muted); padding-top: 6px; border-top: 1px solid var(--line); }
  .empty { font-size: 13px; color: var(--muted); }
  .dq { grid-column: 1 / -1; }
  .dq ul { margin: 6px 0 0; padding-left: 18px; color: var(--ink-2); }

  /* KPIs */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; }
  .kpi .l { font-size: 12px; color: var(--muted); }
  .kpi .v { font-family: var(--font-head); font-size: 20px; font-weight: 600; margin-top: 2px; overflow-wrap: anywhere; }
  .pos { color: var(--good); } .neg { color: var(--bad); } .alert { color: var(--warn); }

  /* Controles */
  .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; padding: 2px; background: var(--bg); margin-top: 10px; }
  .seg button { border: 0; background: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; color: var(--ink-2); }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 0 0 1px var(--line); }
  .seg button:disabled { opacity: .5; cursor: not-allowed; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 10px; }
  .field { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 6px 10px; }
  .field:focus-within { border-color: var(--accent); }
  .field input { border: 0; background: none; outline: none; min-width: 0; }
  .big input { font-size: 18px; font-weight: 600; width: 90px; }
  input[type="date"] { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 6px 8px; color-scheme: inherit; }
  .unit { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; font-size: 12px; color: var(--ink-2); }
  .unit b { color: var(--ink); font-weight: 600; }
  .check { display: flex; gap: 8px; align-items: flex-start; margin-top: 12px; font-size: 12px; color: var(--ink-2); cursor: pointer; }
  .check b { color: var(--ink); font-weight: 600; }
  .check input { margin-top: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chip { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 4px 11px; font-size: 12px; color: var(--ink-2); }
  .chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .linkbtn { background: none; border: 0; color: var(--accent); padding: 0; text-decoration: underline; font-size: 12px; }
  .notice { background: var(--warn-bg); border: 1px solid var(--warn-line); border-radius: 10px; padding: 10px 14px; font-size: 12px; color: var(--ink-2); }

  /* Tabela */
  .filters { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .filters .field input { width: 240px; max-width: 60vw; }
  .filters label { font-size: 12px; color: var(--ink-2); display: inline-flex; gap: 8px; align-items: center; }
  .filters label input { width: 64px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 8px; }
  .scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
  table { border-collapse: collapse; width: 100%; min-width: 2000px; font-size: 13px; }
  th, td { padding: 9px 12px; white-space: nowrap; text-align: right; border-bottom: 1px solid var(--line); }
  thead th { color: var(--muted); font-weight: 500; font-size: 12px; }
  thead tr.groups th { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; text-align: center; border-bottom: 0; padding-bottom: 2px; }
  th.first, td.first { text-align: left; position: sticky; left: 0; background: var(--surface); z-index: 1; max-width: 240px; white-space: normal; }
  tbody tr:hover td { background: var(--bg); }
  .gl { border-left: 1px solid var(--line); }
  th button { background: none; border: 0; color: inherit; font-weight: inherit; font-size: inherit; padding: 0; }
  th button:hover { color: var(--ink); }
  th .arr { font-size: 10px; margin-left: 4px; }
  .adname { font-weight: 600; overflow-wrap: anywhere; }
  .adsub { font-size: 12px; color: var(--muted); font-weight: 400; }
  .unknown .adname { font-style: italic; color: var(--muted); }
  tfoot td { font-weight: 600; background: var(--bg); border-top: 1px solid var(--line); border-bottom: 0; }
  tfoot td.first { background: var(--bg); }
  .manual { width: 74px; text-align: right; border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 4px 6px; outline: none; }
  .manual:focus { border-color: var(--accent); }
  .manual.set { border-color: var(--accent); }
  .warnmark { display: inline-flex; align-items: center; justify-content: center; width: 14px; height: 14px; margin-right: 4px; border-radius: 50%; background: var(--warn); color: var(--surface); font-size: 10px; font-weight: 700; cursor: help; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 16px; margin-bottom: -1px; color: var(--ink-2); font-weight: 500; white-space: nowrap; }
  .tabs button:hover { color: var(--ink); }
  .tabs button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
  .view { display: flex; flex-direction: column; gap: 24px; min-width: 0; }
  .notes { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 6px; max-width: 110ch; }
  .notes b { color: var(--ink-2); font-weight: 600; }

  @media (max-width: 520px) { h1 { font-size: 22px; } .kpi .v { font-size: 18px; } }
</style>

<div class="wrap">
  <header>
    <h1>ROI dos Criativos</h1>
    <p class="sub" id="subtitle"></p>
  </header>

  <nav class="tabs" aria-label="Seções">
    <button type="button" id="tab-metrics" aria-pressed="true">Métricas por anúncio</button>
    <button type="button" id="tab-plan" aria-pressed="false">Plano de campanhas</button>
    <button type="button" id="tab-account" aria-pressed="false">Análise da conta</button>
  </nav>

  <div id="metrics-view" class="view">
  <section aria-labelledby="h-actions">
    <h2 id="h-actions" style="margin-bottom:10px">O que fazer agora</h2>
    <p class="hint" style="margin:0 0 10px">Para ver como dividir o orçamento diário entre esses criativos, abra o <button type="button" class="linkbtn" id="goto-plan">plano de campanhas</button>.</p>
    <div class="actions" id="actions"></div>
  </section>

  <section aria-label="Totais"><div class="kpis" id="kpis"></div></section>

  <section class="controls" aria-label="Controles">
    <div class="panel">
      <div class="panel-title">Custo usado no ROI</div>
      <div class="seg" role="group" aria-label="Origem do custo">
        <button type="button" id="mode-real" aria-pressed="true">Gasto real (planilha)</button>
        <button type="button" id="mode-manual" aria-pressed="false">CPL manual</button>
      </div>
      <div class="row">
        <label class="field big"><span class="muted">R$</span><input id="cpl" inputmode="decimal" placeholder="0,00" aria-label="CPL padrão"></label>
        <span class="hint" id="cpl-hint" style="max-width:300px;margin:0"></span>
      </div>
      <label class="unit"><b>Custo operacional por pedido enviado</b><span class="field"><span class="muted">R$</span><input id="unit" inputmode="decimal" placeholder="0,00" aria-label="Custo operacional por pedido enviado" style="width:64px"></span><span class="muted">produto, frete e demais custos, também nos inadimplentes</span></label>
      <label class="check"><input type="checkbox" id="discount" checked><span><b>Descontar a inadimplência do lucro e do ROI</b><br><span class="muted">Lucro = receita − custo − valor em aberto dos pedidos inadimplentes.</span></span></label>
      <p class="hint">Para um item específico, digite um CPL na última coluna da tabela. <button type="button" class="linkbtn" id="clear-overrides" hidden></button></p>
    </div>
    <div class="panel">
      <div class="panel-title">Período (data de entrada do lead)</div>
      <div class="row">
        <input type="date" id="from" aria-label="Data inicial">
        <span class="muted" style="font-size:12px">até</span>
        <input type="date" id="to" aria-label="Data final">
      </div>
      <div class="chips" id="presets"></div>
    </div>
  </section>

  <div id="notices" style="display:flex;flex-direction:column;gap:10px"></div>

  <section aria-labelledby="h-table" style="display:flex;flex-direction:column;gap:12px" id="table-section">
    <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between">
      <h2 id="h-table">Métricas por anúncio</h2>
      <div class="seg" style="margin:0" role="group" aria-label="Agrupar por">
        <button type="button" id="view-ad" aria-pressed="true">Por anúncio</button>
        <button type="button" id="view-camp" aria-pressed="false">Por campanha</button>
      </div>
    </div>
    <div class="filters">
      <label class="field"><svg class="muted" aria-hidden="true" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg><input id="search" placeholder="Pesquisar anúncio ou campanha..." aria-label="Pesquisar anúncio ou campanha"></label>
      <label>Mínimo de leads <input id="minleads" inputmode="numeric" value="0"></label>
      <label>Gasto mínimo <span class="field"><span class="muted">R$</span><input id="minspend" inputmode="decimal" value="0" aria-label="Gasto mínimo por anúncio" style="width:80px"></span></label>
      <span class="muted" style="font-size:12px" id="rowcount"></span>
    </div>
    <div class="scroll"><table id="tbl"></table></div>
  </section>

  <section class="notes" id="notes"></section>
  </div>

  <div id="plan-view" class="view" hidden><div id="plan-root"></div></div>

  <div id="account-view" class="view" hidden><div id="account-root"></div></div>
</div>

<script>
(function () {
  var D = JSON.parse(document.getElementById('data').textContent);
  var leadsStart = D.sources.leadsRange[0], leadsEnd = D.sources.leadsRange[1];
  var dataEnd = [leadsEnd, D.sources.paidRange[1]].sort().pop();
  var STORE = 'roi-criativos:v1';

  var brl = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
  var nf0 = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 0 });
  function money(v) { return v == null ? '—' : brl.format(v); }
  function int(v) { return v == null ? '—' : nf0.format(Math.round(v)); }
  function pct(v, d) { return v == null ? '—' : v.toLocaleString('pt-BR', { minimumFractionDigits: d == null ? 2 : d, maximumFractionDigits: d == null ? 2 : d }) + '%'; }
  function roasf(v) { return v == null ? '—' : v.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + 'x'; }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmtDate(d) { return d ? d.split('-').reverse().join('/') : '—'; }
  function div(a, b) { return b > 0 ? a / b : null; }
  function parseMoney(s) { var n = Number(String(s || '').trim().replace(',', '.')); return isFinite(n) && n > 0 ? n : null; }
  function shiftDay(day, delta) { var d = new Date(day + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + delta); return d.toISOString().slice(0, 10); }
  function cls(v) { return v == null ? 'muted' : v >= 0 ? 'pos' : 'neg'; }
  function $(id) { return document.getElementById(id); }

  var hasSpend = D.sources.spendTotal > 0;
  var hasCampSpend = D.sources.campaignSpendTotal > 0;
  var campCovered = 0, campTotal = 0;
  (function () {
    var l = D.campaigns.map(function () { return 0; });
    D.rows.forEach(function (r) { if (r[2] !== '' && r[2] >= leadsStart) l[r[1]] += r[3]; });
    D.campaigns.forEach(function (c, i) { if (c.key === '') return; campTotal += l[i]; if (c.spend) campCovered += l[i]; });
  })();
  var S = { from: leadsStart, to: '', mode: hasSpend ? 'real' : 'manual', discount: true, unit: '80', cpl: '', overrides: {}, search: '', minLeads: 0, minSpend: 0, view: 'ad', sortKey: 'spend', sortDir: 'desc' };
  try {
    var saved = JSON.parse(localStorage.getItem(STORE) || 'null');
    if (saved) { S.cpl = saved.cpl || ''; S.overrides = saved.overrides || {}; if (saved.mode === 'manual' || (saved.mode === 'real' && hasSpend)) S.mode = saved.mode; if (saved.discount === false) S.discount = false; if (typeof saved.unit === 'string') S.unit = saved.unit; }
  } catch (e) {}
  function persist() { try { localStorage.setItem(STORE, JSON.stringify({ cpl: S.cpl, overrides: S.overrides, mode: S.mode, discount: S.discount, unit: S.unit })); } catch (e) {} }

  // ---------- cálculo ----------
  var C0 = D.campaigns.findIndex(function (c) { return c.key === ''; });
  function build(mode) {
    var nC = D.campaigns.length, isAd = mode === 'ad';
    var datedAll = D.ads.map(function () { return 0; });
    var cDatedAll = D.campaigns.map(function () { return 0; }), cDated = D.campaigns.map(function () { return 0; });
    var pairs = {};
    function pair(a, c) { var k = a * nC + c, p = pairs[k]; if (!p) p = pairs[k] = { a: a, c: c, leads: 0, sales: 0, rev: 0, inad: 0, inadVal: 0, dated: 0 }; return p; }
    var undated = !S.from && !S.to;
    D.rows.forEach(function (r) {
      var day = r[2];
      if (day !== '') { datedAll[r[0]] += r[3]; cDatedAll[r[1]] += r[3]; }
      if (day === '') { if (!undated) return; }
      else if ((S.from && day < S.from) || (S.to && day > S.to)) return;
      var p = pair(r[0], r[1]);
      if (day !== '') { p.dated += r[3]; cDated[r[1]] += r[3]; }
      p.leads += r[3]; p.sales += r[4]; p.rev += r[5]; p.inad += r[6]; p.inadVal += r[7];
    });
    var whole = (!S.from || S.from <= leadsStart) && (!S.to || S.to >= leadsEnd);
    // Criativo com gasto e sem nenhum lead datado: o gasto cai em "(sem campanha identificada)".
    if (isAd) D.ads.forEach(function (ad, a) { if (ad.spend && datedAll[a] === 0) pair(a, C0); });

    // O gasto da planilha é por criativo. Cada par (anúncio, campanha) recebe a fração do gasto
    // igual à fração dos leads datados do anúncio que caem nele e no período.
    var groups = {};
    function newGroup() { return { leads: 0, sales: 0, rev: 0, inad: 0, inadVal: 0, meta: false, spend: 0, impr: 0, clicks: 0, conv: 0, members: {} }; }
    Object.keys(pairs).forEach(function (k) {
      var p = pairs[k], meta = D.ads[p.a].spend, f = 0;
      if (meta) { if (datedAll[p.a] > 0) f = Math.min(1, p.dated / datedAll[p.a]); else if (p.c === C0 && whole) f = 1; }
      var gk = isAd ? p.a : p.c;
      var g = groups[gk] || (groups[gk] = newGroup());
      g.leads += p.leads; g.sales += p.sales; g.rev += p.rev; g.inad += p.inad; g.inadVal += p.inadVal;
      if (meta && isAd) { g.meta = true; g.spend += meta.spend * f; g.impr += meta.impressions * f; g.clicks += meta.linkClicks * f; g.conv += meta.conversations * f; }
      var mk = isAd ? p.c : p.a;
      g.members[mk] = (g.members[mk] || 0) + p.leads + p.sales;
    });

    // Visão por campanha: usa o custo real de cada campanha (planilha "Custo campanhas"), na fração de leads do período.
    if (!isAd) D.campaigns.forEach(function (camp, c) {
      var meta = camp.spend; if (!meta) return;
      var f = cDatedAll[c] > 0 ? Math.min(1, cDated[c] / cDatedAll[c]) : (whole ? 1 : 0);
      var g = groups[c] || (groups[c] = newGroup());
      g.meta = true; g.spend += meta.spend * f; g.impr += meta.impressions * f; g.clicks += meta.linkClicks * f; g.conv += meta.conversations * f;
    });
    var globalCpl = parseMoney(S.cpl);
    var unit = parseMoney(S.unit) || 0;
    var out = [];
    Object.keys(groups).forEach(function (gk) {
      var g = groups[gk], spend = g.meta ? g.spend : null;
      if (g.leads === 0 && g.sales === 0 && g.inad === 0 && !(spend && spend > 0)) return;
      var ad = isAd ? D.ads[gk] : null, camp = isAd ? null : D.campaigns[gk];
      var id = isAd ? ad.key : 'c:' + camp.key;
      var ov = parseMoney(S.overrides[id]);
      var cost;

    var b = e.target.closest('button[data-p]'); if (!b) return;
    var p = [[leadsStart, ''], [shiftDay(dataEnd, -29), ''], [shiftDay(dataEnd, -6), ''], ['', '']][Number(b.getAttribute('data-p'))];
    S.from = p[0]; S.to = p[1]; render();
  });
  $('actions').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-ad]'); if (!b) return;
    S.view = 'ad'; S.search = b.getAttribute('data-ad'); $('search').value = S.search; S.minLeads = 0; $('minleads').value = '0'; S.minSpend = 0; $('minspend').value = '0'; render();
    $('table-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  $('tbl').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-sort]'); if (!b) return;
    var k = b.getAttribute('data-sort');
    if (S.sortKey === k) S.sortDir = S.sortDir === 'asc' ? 'desc' : 'asc'; else { S.sortKey = k; S.sortDir = k === 'name' ? 'asc' : 'desc'; }
    render();
  });
  $('tbl').addEventListener('input', function (e) {
    var el = e.target; if (!el.classList || !el.classList.contains('manual')) return;
    var key = el.getAttribute('data-key');
    if (el.value.trim()) S.overrides[key] = el.value; else delete S.overrides[key];
    persist(); render();
  });

  // ---------- abas: métricas / plano ----------
  var planDone = false, accountDone = false;
  function showTab(name) {
    $('metrics-view').hidden = name !== 'metrics'; $('plan-view').hidden = name !== 'plan'; $('account-view').hidden = name !== 'account';
    $('tab-metrics').setAttribute('aria-pressed', String(name === 'metrics')); $('tab-plan').setAttribute('aria-pressed', String(name === 'plan')); $('tab-account').setAttribute('aria-pressed', String(name === 'account'));
    if (name === 'plan' && !planDone) { planDone = true; window.renderPlan(JSON.parse($('plan').textContent), $('plan-root')); }
    if (name === 'account' && !accountDone) { accountDone = true; window.renderAccount(JSON.parse($('account').textContent), $('account-root')); }
  }
  function routeFromHash() { showTab(location.hash === '#plano' ? 'plan' : location.hash === '#conta' ? 'account' : 'metrics'); }
  $('tab-metrics').addEventListener('click', function () { location.hash = ''; showTab('metrics'); });
  $('tab-plan').addEventListener('click', function () { location.hash = 'plano'; showTab('plan'); });
  $('tab-account').addEventListener('click', function () { location.hash = 'conta'; showTab('account'); });
  $('goto-plan').addEventListener('click', function () { location.hash = 'plano'; showTab('plan'); window.scrollTo(0, 0); });
  window.addEventListener('hashchange', routeFromHash);
  routeFromHash();

  $('cpl').value = S.cpl;
  $('discount').checked = S.discount;
  $('unit').value = S.unit;
  renderSubtitle();
  render();
})();
</script>
